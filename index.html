<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TaxIQ Engine Demo</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 24px; }
    h1 { font-size: 42px; margin: 0 0 14px; }
    pre { background: #f6f6f6; padding: 14px; border-radius: 10px; overflow:auto; }
    .err { color: #b00020; font-weight: 700; }
  </style>
</head>
<body>
  <h1>TaxIQ Engine Demo</h1>
  <pre id="out">Loading…</pre>

  <script type="module">
    const out = document.getElementById("out");
    try {
      const { demo } = await import("./src/app/app.js");
      const result = await demo();
      out.textContent = JSON.stringify(result, null, 2);
    } catch (e) {
      out.innerHTML = "<span class='err'>JS ERROR:</span>\n" + (e?.stack || e?.message || String(e));
      console.error(e);
    }
  </script>
</body>
</html>
