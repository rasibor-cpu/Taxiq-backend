<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaxIQ — Nigeria PAYE (Demo)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 980px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { font-size: 12px; color: #444; display:block; margin-bottom: 6px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    button { padding: 10px 14px; border: 0; border-radius: 8px; cursor: pointer; }
    .btn { background: #111; color:#fff; }
    .muted { color:#666; font-size: 12px; }
    .kpi { font-size: 20px; font-weight: 700; }
    table { width:100%; border-collapse: collapse; }
    td { padding: 8px; border-bottom: 1px solid #eee; }
    td:first-child { color:#444; }
  </style>
</head>
<body>
  <h1>TaxIQ — Nigeria PAYE (Demo)</h1>
  <p class="muted">Enter gross pay and statutory deductions. This calculates annual & monthly PAYE using common PITA banding assumptions.</p>

  <div class="card">
    <div class="row">
      <div>
        <label>Pay Frequency</label>
        <select id="freq">
          <option value="monthly" selected>Monthly</option>
          <option value="annual">Annual</option>
        </select>
      </div>
      <div>
        <label>Gross Pay (₦)</label>
        <input id="gross" type="number" min="0" step="1000" placeholder="e.g., 500000" />
      </div>

      <div>
        <label>Pension (% of gross)</label>
        <input id="pensionPct" type="number" min="0" max="50" step="0.5" value="8" />
      </div>
      <div>
        <label>NHF (% of gross)</label>
        <input id="nhfPct" type="number" min="0" max="20" step="0.5" value="2.5" />
      </div>

      <div>
        <label>Other Allowable Deductions (₦ per year)</label>
        <input id="otherDed" type="number" min="0" step="1000" value="0" />
      </div>
      <div>
        <label>Reliefs Mode</label>
        <select id="reliefMode">
          <option value="standard" selected>Standard CRA (₦200k + 20% of gross)</option>
          <option value="none">No CRA (testing only)</option>
        </select>
      </div>
    </div>

    <div style="margin-top:14px;">
      <button class="btn" id="calcBtn">Calculate PAYE</button>
      <span class="muted" id="status" style="margin-left:10px;"></span>
    </div>
  </div>

  <div class="card">
    <div class="kpi" id="headline">—</div>
    <table>
      <tbody id="out"></tbody>
    </table>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
