<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TaxIQ v0.5.1 — Nigerian Tax Engine</title>

<style>
:root{
  --bg:#070b14; --card:#0d1627; --card2:#0b1220;
  --text:#e8eefc; --muted:#a9b6d3; --line:rgba(255,255,255,.08);
  --btn:#1b2a45; --ok:#4ade80; --bad:#ff6b6b;
  --radius:16px;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:var(--bg);color:var(--text)
}
.wrap{max-width:1200px;margin:auto;padding:20px}
h1{margin:0;font-size:26px}
.sub{color:var(--muted);margin-top:4px;font-size:14px}

.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px;margin-top:16px
}
.row{display:flex;gap:12px;flex-wrap:wrap}
.field{flex:1 1 260px;display:flex;flex-direction:column;gap:6px}
label{font-size:12px;color:var(--muted)}
input,select{
  padding:10px;border-radius:12px;border:1px solid var(--line);
  background:var(--card2);color:var(--text)
}
.money{font-variant-numeric:tabular-nums}

button{
  padding:10px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--btn);color:#fff;font-weight:700;cursor:pointer
}
button.secondary{background:#101a2b}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .t{font-size:12px;color:var(--muted)}
.kpi .v{margin-top:6px;font-size:18px;font-weight:900}

.badge{font-size:12px;color:var(--muted);margin-left:10px}

.table{width:100%;border-collapse:collapse;margin-top:10px}
.table th,.table td{
  padding:8px;border-bottom:1px solid var(--line);font-size:13px
}
.table th{color:#dbe6ff;text-align:left}

.hidden{display:none}
.ok{color:var(--ok)} .bad{color:var(--bad)}
</style>
</head>

<body>
<div class="wrap">
  <h1>TaxIQ</h1>
  <div class="sub">v0.5.1 — PAYE · VAT · WHT · <b>CIT (Full Rules)</b></div>

  <!-- MODULE SELECTOR -->
  <div class="card">
    <label>Tax Module</label>
    <select id="moduleSel">
      <option value="paye">PAYE</option>
      <option value="vat">VAT</option>
      <option value="wht">WHT</option>
      <option value="cit" selected>CIT</option>
    </select>
  </div>

  <!-- CIT INPUTS -->
  <div class="card" id="citCard">
    <h3>Companies Income Tax (CIT)</h3>

    <div class="row">
      <div class="field">
        <label>Turnover (₦)</label>
        <input id="citTurnover" class="money" placeholder="e.g. 250,000,000">
      </div>
      <div class="field">
        <label>Profit Before Tax – PBT (₦)</label>
        <input id="citPBT" class="money" placeholder="e.g. 40,000,000">
      </div>
    </div>

    <h4 style="margin-top:16px">Add-backs / Adjustments</h4>
    <table class="table">
      <thead>
        <tr><th>Description</th><th>Amount (₦)</th></tr>
      </thead>
      <tbody id="adjBody">
        <tr>
          <td>Depreciation</td>
          <td><input class="money adj"></td>
        </tr>
        <tr>
          <td>Fines & Penalties</td>
          <td><input class="money adj"></td>
        </tr>
        <tr>
          <td>Non-business expenses</td>
          <td><input class="money adj"></td>
        </tr>
      </tbody>
    </table>

    <div class="row" style="margin-top:14px">
      <div class="field">
        <label>
          <input type="checkbox" id="useMinTax"> Apply Minimum Tax
        </label>
      </div>
      <div class="field">
        <label>Minimum Tax Rate (%)</label>
        <input id="minTaxRate" class="money" value="0.5">
      </div>
    </div>

    <h4 style="margin-top:16px">Statutory Levies</h4>
    <div class="row">
      <div class="field">
        <label><input type="checkbox" id="useTET" checked> TET (2.5% of Assessable Profit)</label>
      </div>
      <div class="field">
        <label><input type="checkbox" id="useNITDL"> NITDL (1% of PBT)</label>
      </div>
      <div class="field">
        <label><input type="checkbox" id="useNASENI"> NASENI (0.25% of Turnover)</label>
      </div>
    </div>

    <div class="row" style="margin-top:16px">
      <button id="btnCalc">Compute CIT</button>
      <button class="secondary" onclick="window.print()">Print Slip</button>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="card">
    <h3>Results</h3>
    <div class="kpis">
      <div class="kpi">
        <div class="t">Assessable Profit</div>
        <div class="v" id="resAssess">—</div>
      </div>
      <div class="kpi">
        <div class="t">CIT Payable</div>
        <div class="v" id="resCIT">—</div>
      </div>
      <div class="kpi">
        <div class="t">Total Levies</div>
        <div class="v" id="resLevies">—</div>
      </div>
      <div class="kpi">
        <div class="t">Total Company Taxes</div>
        <div class="v" id="resTotal">—</div>
      </div>
    </div>
  </div>
</div>

<script>
function num(v){
  if(!v) return 0;
  return Number(String(v).replace(/,/g,'')) || 0;
}
function fmt(n){
  return "₦ " + Number(n).toLocaleString();
}

document.querySelectorAll(".money").forEach(i=>{
  i.addEventListener("input",()=>{
    i.value = i.value.replace(/,/g,"").replace(/[^\d.]/g,"");
    if(i.value) i.value = Number(i.value).toLocaleString();
  });
});

document.getElementById("btnCalc").onclick = ()=>{
  const turnover = num(citTurnover.value);
  const pbt = num(citPBT.value);

  let addbacks = 0;
  document.querySelectorAll(".adj").forEach(i=>addbacks += num(i.value));

  const assessable = Math.max(0, pbt + addbacks);

  let citRate = turnover < 25_000_000 ? 0 :
                turnover < 100_000_000 ? 0.20 : 0.30;

  let cit = assessable * citRate;

  if(useMinTax.checked){
    const minTax = turnover * (num(minTaxRate.value)/100);
    cit = Math.max(cit, minTax);
  }

  let levies = 0;
  if(useTET.checked) levies += assessable * 0.025;
  if(useNITDL.checked) levies += pbt * 0.01;
  if(useNASENI.checked) levies += turnover * 0.0025;

  const total = cit + levies;

  resAssess.textContent = fmt(assessable);
  resCIT.textContent = fmt(cit);
  resLevies.textContent = fmt(levies);
  resTotal.textContent = fmt(total);
};
</script>
</body>
</html>
