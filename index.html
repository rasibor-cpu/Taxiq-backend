<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1220" />
  <title>TaxIQ — Nigerian Tax Calculator</title>

  <style>
    :root{
      --bg:#0b1220;
      --card:#0f1b33;
      --text:#e8eefc;
      --muted:#a9b7d1;
      --line:rgba(232,238,252,.12);
      --accent:#5aa7ff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    header{
      padding:16px 14px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .brand{display:flex;flex-direction:column;line-height:1.1}
    .brand b{font-size:16px}
    .brand span{font-size:12px;color:var(--muted)}
    .pill{
      font-size:12px;
      border:1px solid var(--line);
      padding:6px 10px;
      border-radius:999px;
      color:var(--muted);
    }
    main{padding:14px}
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
      box-shadow:0 10px 30px rgba(0,0,0,.25);
      max-width:980px;
      margin:0 auto;
    }
    .hint{
      margin-top:10px;
      font-size:13px;
      color:var(--muted);
    }
    .hint code{
      background:rgba(232,238,252,.08);
      padding:2px 6px;
      border-radius:8px;
      color:var(--text);
    }
    .error{
      margin-top:12px;
      padding:12px;
      border-radius:12px;
      border:1px solid rgba(255,90,90,.25);
      background:rgba(255,90,90,.08);
      color:#ffd6d6;
      display:none;
      white-space:pre-wrap;
      font-size:12px;
    }
    footer{
      padding:14px;
      color:var(--muted);
      font-size:12px;
      text-align:center;
    }
    a{color:var(--accent)}
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <b>TaxIQ</b>
      <span>Nigerian tax calculator (PAYE v1)</span>
    </div>
    <div class="pill">GitHub Pages</div>
  </header>

  <main>
    <div class="card">
      <div id="app"></div>

      <div class="hint">
        App entry: <code>./src/app/src/app/app.js</code><br>
        If anything fails, an error box will show below (useful on phone).
      </div>

      <div id="err" class="error"></div>
    </div>
  </main>

  <footer>TaxIQ • Prototype build</footer>

  <!-- IMPORTANT: relative path (./) so it works under /Taxiq-backend/ -->
  <script type="module" src="./src/app/src/app/app.js"></script>

  <script>
    window.addEventListener('error', function (e) {
      const el = document.getElementById('err');
      if (!el) return;
      el.style.display = 'block';
      el.textContent = 'Runtime error:\\n' + (e && e.message ? e.message : String(e));
    });
    window.addEventListener('unhandledrejection', function (e) {
      const el = document.getElementById('err');
      if (!el) return;
      el.style.display = 'block';
      el.textContent = 'Unhandled promise rejection:\\n' + (e && e.reason ? String(e.reason) : 'Unknown');
    });
  </script>
</body>
</html>
